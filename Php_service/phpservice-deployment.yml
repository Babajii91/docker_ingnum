apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpservice
  template:
    metadata:
      labels:
        app: phpservice
    spec:
      containers:
      - name: phpservice
        image: johary94/phpservice:2
        ports:
        - containerPort: 80
